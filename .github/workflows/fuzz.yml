# Short libFuzzer runs of the network-edge decoders (fuzz/, cargo-fuzz).
# Each target runs for FUZZ_SECONDS from the committed seed corpus; a crash fails the job
# and uploads the reproducer.
name: Fuzz

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * 1" # weekly, longer runs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [frame_codec, request_decode, record_batch]
    steps:
      - uses: actions/checkout@v4
      # The action reads rust-toolchain.toml (nightly, which cargo-fuzz needs).
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The fuzz crate links pg_kafka (pg14), whose pgrx build needs pg_config.
      - uses: ./.github/actions/setup-pg
        with:
          pg: 14

      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-v1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '180' }}
        run: |
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=4096 -max_len=1048576

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
