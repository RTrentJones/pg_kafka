name: Evidence

# Continuously-verified evidence for the pg_kafka showcase (rtrentjones.dev/pg_kafka). Brings the
# extension up exactly the way ci.yml's E2E jobs do (scripts/ci-pg.sh + the real-broker compose),
# then runs the client conformance matrix, the benchmark (with raw-INSERT floor + real-broker
# ceiling) and the recorded session, and:
#   1. force-pushes conformance.json / bench.json / session.svg to the orphan `evidence` branch
#      (a snapshot, kept out of main history) — the site reads them from raw.githubusercontent,
#   2. POSTs the normalized benchmark into Tracer (tracer.rtrentjones.dev → /runs?tool=pg_kafka).
#
# Secrets (optional, both fail open): TRACER_INGEST_TOKEN enables the Tracer post.
on:
  schedule:
    - cron: '0 6 * * 1' # weekly (the run does a full pgrx build)
  push:
    tags: ['v*'] # refresh on each tagged release
  workflow_dispatch:

permissions:
  contents: write # push the orphan evidence branch

concurrency:
  group: evidence
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # hard ceiling — harnesses are individually timeout-wrapped; this is the backstop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/free-disk-space

      - name: Install Rust toolchain
        # The toolchain comes from rust-toolchain.toml (a dated nightly pin).
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: ./.github/actions/setup-pg
        with:
          pg: 14
          owned: 'true'
          cache-prefix: v3-evidence

      - name: Install evidence tooling
        run: sudo apt-get install -y postgresql-client kafkacat asciinema

      - name: Install extension
        run: cargo pgrx install --release --pg-config "$PG_CONFIG"

      - name: Start Postgres with pg_kafka preloaded
        # Same cluster setup as ci.yml's E2E jobs (scripts/ci-pg.sh): pg_kafka on 127.0.0.1:9092,
        # advertised as 127.0.0.1 (librdkafka/kcat follow 'localhost' to ::1, which nothing
        # binds). Exports PGHOST/PGPORT/PGUSER/PGDATABASE.
        timeout-minutes: 3
        run: scripts/ci-pg.sh start "$RUNNER_TEMP/pg"

      - name: Start real broker (ceiling baseline)
        uses: ./.github/actions/start-external-kafka

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recording tooling (kcat alias + svg-term)
        run: |
          command -v kcat >/dev/null 2>&1 || sudo ln -sf "$(command -v kafkacat)" /usr/local/bin/kcat
          npm install -g svg-term-cli

      - name: Generate evidence
        env:
          PG_KAFKA_BROKER: 127.0.0.1:9092
          REAL_BROKER: localhost:9093
        run: |
          mkdir -p evidence-out
          bash scripts/generate-evidence.sh "$PWD/evidence-out"

      - name: Publish to the orphan evidence branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd evidence-out
          shopt -s nullglob
          files=()
          for f in conformance.json bench.json session.svg shadow.json; do [ -f "$f" ] && files+=("$f"); done
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::no artifacts produced — nothing to publish"; exit 0; fi
          git init -q
          git checkout -q -b evidence
          git add "${files[@]}"
          git -c user.name='pg-kafka-evidence[bot]' \
              -c user.email='actions@github.com' \
              commit -qm "evidence: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" evidence

      - name: Ingest benchmark into Tracer
        if: hashFiles('evidence-out/bench.json') != ''
        env:
          TRACER_INGEST_TOKEN: ${{ secrets.TRACER_INGEST_TOKEN }}
        run: node .github/scripts/ingest-tracer.mjs evidence-out/bench.json

      - name: Teardown
        if: always()
        run: |
          docker compose down -v || true
          scripts/ci-pg.sh stop "$RUNNER_TEMP/pg" || true
