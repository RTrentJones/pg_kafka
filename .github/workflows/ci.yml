name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  pull-requests: write

# Every job gets PostgreSQL from apt.postgresql.org and the cargo-pgrx that Cargo.lock pins
# through .github/actions/setup-pg (no pgrx source download), and the Rust toolchain from
# rust-toolchain.toml (a dated nightly pin, the single source of truth for local builds and CI;
# actions-rust-lang/setup-rust-toolchain reads it when no toolchain is given).

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check formatting (kafka_test)
        run: cd kafka_test && cargo fmt -- --check

      - name: QA-1 coverage policy (codecov.yml lists every SPI file; the guard fires for each)
        run: bash .github/scripts/check-coverage-policy.sh

      - uses: ./.github/actions/setup-pg
        with:
          pg: 14

      - name: Run clippy
        # --all-targets so test code is linted too. The other majors are linted in `e2e`.
        run: cargo clippy --all-targets --features pg14 -- -D warnings

      - name: Run clippy (kafka_test)
        run: cd kafka_test && cargo clippy --all-targets -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - uses: ./.github/actions/setup-pg
        with:
          pg: 14
          cache-prefix: v3-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run unit tests and generate coverage
        # pg_kafka uses PGC_POSTMASTER GUCs, which `cargo pgrx test` cannot load (it creates
        # the extension after the server started), so unit tests here are the non-SPI ones;
        # everything SPI is covered by the E2E jobs. The unit tests include
        # kafka::api::docs::generated_api_docs, the drift check of the docs generated from the
        # API registry.
        run: cargo llvm-cov --lib --features pg14 --lcov --output-path lcov.info
        env:
          RUSTFLAGS: ""

      - name: Run property tests
        # tests/property_tests.rs is an integration target, which `cargo llvm-cov --lib`
        # never compiles.
        run: cargo test --features pg14 --test property_tests
        env:
          RUSTFLAGS: ""

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The E2E runner does not depend on the PostgreSQL major: build it once.
  kafka-test-build:
    name: Build kafka_test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsasl2-dev libzstd-dev zlib1g-dev
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v3-kt
          workspaces: kafka_test -> kafka_test/target
      - name: Build
        run: cd kafka_test && cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: kafka_test
          path: kafka_test/target/release/kafka_test
          retention-days: 3

  # Every supported major, for real: build + unit/property tests + clippy on that major,
  # install the extension into PostgreSQL N, run the functional E2E suite and the 0.0.0 -> 0.1.0
  # upgrade check against it. PG14 also runs the shadow and performance categories and the
  # test-count drift check.
  e2e:
    name: E2E pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    needs: [lint, kafka-test-build]
    # Cold build ~20 min + suite (~5 min measured on 4 cores, 223 functional tests including
    # listener restarts) + shadow/performance on pg14.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        pg: [14, 15, 16, 17, 18]
    env:
      FEATURES: --no-default-features --features pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      - uses: ./.github/actions/setup-pg
        with:
          pg: ${{ matrix.pg }}
          owned: 'true'
          cache-prefix: v3-pg${{ matrix.pg }}

      - name: Clippy (pg${{ matrix.pg }})
        run: cargo clippy --all-targets $FEATURES -- -D warnings

      - name: Unit tests (pg${{ matrix.pg }})
        run: cargo test --lib $FEATURES
        env:
          RUSTFLAGS: ""

      - name: Property tests (pg${{ matrix.pg }})
        run: cargo test --test property_tests $FEATURES
        env:
          RUSTFLAGS: ""

      - name: Install the extension into PostgreSQL ${{ matrix.pg }}
        run: cargo pgrx install --release --pg-config "$PG_CONFIG"

      - uses: actions/download-artifact@v4
        with:
          name: kafka_test
          path: ${{ runner.temp }}/kt
      - name: Locate kafka_test
        run: |
          chmod +x "$RUNNER_TEMP/kt/kafka_test"
          echo "KAFKA_TEST_BIN=$RUNNER_TEMP/kt/kafka_test" >> "$GITHUB_ENV"

      - name: Start PostgreSQL with pg_kafka preloaded
        timeout-minutes: 3
        run: scripts/ci-pg.sh start "$RUNNER_TEMP/pg"

      - name: Functional E2E tests
        # Measured 4.5 min on PG18 in a 4-core sandbox; the margin covers slow runners.
        timeout-minutes: 25
        working-directory: kafka_test
        run: '"$KAFKA_TEST_BIN" --exclude performance --exclude shadow --timeout-secs 300'

      - name: Check extension upgrade path
        # The 0.0.0 -> current ALTER EXTENSION UPDATE path must produce exactly the schema of a
        # fresh install and keep data (two scratch databases; the worker serves 'postgres').
        timeout-minutes: 5
        run: scripts/check-upgrade.sh

      - name: Generated GUC reference is current (docs/CONFIGURATION.md)
        timeout-minutes: 2
        run: python3 scripts/gen-docs.py --check --only gucs

      - name: Generated test counts are current (docs/TEST_STRATEGY.md)
        if: matrix.pg == 14
        timeout-minutes: 20
        run: python3 scripts/gen-docs.py --check --only tests
        env:
          GEN_DOCS_FEATURES: ${{ env.FEATURES }}

      - name: Start external Kafka (shadow tests)
        if: matrix.pg == 14
        uses: ./.github/actions/start-external-kafka

      - name: Shadow mode E2E tests
        if: matrix.pg == 14
        timeout-minutes: 15
        working-directory: kafka_test
        run: '"$KAFKA_TEST_BIN" --category shadow'

      - name: Stop external Kafka
        if: always() && matrix.pg == 14
        run: docker compose down -v || true

      - name: Performance E2E tests
        # Blocking. The thresholds are conservative floors (~5-10x below dev-machine
        # measurements), so this fails only on order-of-magnitude regressions.
        if: matrix.pg == 14
        timeout-minutes: 10
        working-directory: kafka_test
        run: '"$KAFKA_TEST_BIN" --category performance'

      - name: Postgres log (on failure)
        if: failure()
        run: |
          scripts/ci-pg.sh log "$RUNNER_TEMP/pg" | tail -300
          ss -tlnp | grep -E '9092|1909[3-5]' || echo "no pg_kafka listener"

      - name: Stop PostgreSQL
        if: always()
        run: scripts/ci-pg.sh stop "$RUNNER_TEMP/pg"

  # Real Kafka clients against pg_kafka: the Apache Kafka 3.7 Java tools (interop/run-java-checks.sh)
  # and the differential harness that replays the same raw requests against pg_kafka and a real
  # Kafka broker (interop/diff/). Known failures are listed in the scripts (XFAIL in
  # java_checks.py, KNOWN in diff/run.py); one that passes is reported as XPASS and fails the job.
  interop:
    name: Interop (Java clients, differential vs Kafka)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 75
    env:
      KAFKA_VERSION: "3.7.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: ./.github/actions/setup-pg
        with:
          pg: 18
          owned: 'true'
          cache-prefix: v3-interop
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the Kafka distribution
        id: cache-kafka
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/kafka_2.13-${{ env.KAFKA_VERSION }}
          key: kafka-2.13-${{ env.KAFKA_VERSION }}
      - name: Download Kafka ${{ env.KAFKA_VERSION }}
        if: steps.cache-kafka.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://archive.apache.org/dist/kafka/$KAFKA_VERSION/kafka_2.13-$KAFKA_VERSION.tgz" \
            | tar -xz -C "$RUNNER_TEMP"
      - name: Install the extension
        run: cargo pgrx install --release --pg-config "$PG_CONFIG"
      - name: Start PostgreSQL with pg_kafka preloaded
        timeout-minutes: 3
        run: scripts/ci-pg.sh start "$RUNNER_TEMP/pg"
      - name: Start the reference Kafka broker (127.0.0.1:9093)
        timeout-minutes: 3
        run: interop/kafka-ref.sh start "$RUNNER_TEMP/kafka_2.13-$KAFKA_VERSION" "$RUNNER_TEMP/kref"
      - name: Java client checks
        timeout-minutes: 30
        run: interop/run-java-checks.sh
        env:
          KAFKA_HOME: ${{ runner.temp }}/kafka_2.13-${{ env.KAFKA_VERSION }}
      - name: Differential test against Apache Kafka
        timeout-minutes: 10
        run: python3 interop/diff/run.py --pg 127.0.0.1:9092 --kafka 127.0.0.1:9093
      - name: Logs (on failure)
        if: failure()
        run: |
          scripts/ci-pg.sh log "$RUNNER_TEMP/pg" | tail -300
          tail -100 "$RUNNER_TEMP/kref/server.log" || true
      - name: Stop
        if: always()
        run: |
          interop/kafka-ref.sh stop "$RUNNER_TEMP/kafka_2.13-$KAFKA_VERSION" "$RUNNER_TEMP/kref" || true
          scripts/ci-pg.sh stop "$RUNNER_TEMP/pg"

  # Security audit for known vulnerabilities.
  # Blocking. Both lockfiles are scanned — the kafka_test crate has its own Cargo.lock.
  # cargo-deny additionally enforces license policy and pins the allowed git sources to the
  # patched kafka-protocol fork (see deny.toml).
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run security audit
        run: cargo audit
      - name: Run security audit (kafka_test)
        run: cd kafka_test && cargo audit
      - name: Run cargo-deny
        run: cargo deny check
      - name: Run cargo-deny (kafka_test)
        run: cd kafka_test && cargo deny check

  # Verify Cargo.lock is up-to-date
  lockfile:
    name: Verify Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: ./.github/actions/setup-pg
        with:
          pg: 14
      - name: Check Cargo.lock is up-to-date
        run: cargo check --locked --features pg14
      - name: Check kafka_test Cargo.lock is up-to-date
        run: cd kafka_test && cargo check --locked

  # QA-1 enforcement (see codecov.yml + CLAUDE.md): the SPI/async files excluded from unit
  # coverage (and the qa1-guard files) can't be caught by the codecov gate, so a behavioural
  # change to one of them must ship a kafka_test E2E regression test.
  spi-e2e-guard:
    name: SPI change needs E2E test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require a kafka_test change when an SPI/async file changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          gh pr view "$PR_NUMBER" --json files --jq '.files[].path' \
            | bash .github/scripts/require-e2e-for-spi.sh
