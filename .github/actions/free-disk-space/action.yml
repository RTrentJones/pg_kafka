name: Free disk space
description: >
  Remove preinstalled software the pgrx builds do not use (~10 GB), so a release build of the
  extension fits on a hosted runner.
runs:
  using: composite
  steps:
    - name: Remove unused preinstalled software
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
        sudo apt-get clean
        df -h /
