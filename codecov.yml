# Codecov Configuration
# https://docs.codecov.com/docs/codecov-yaml
#
# Coverage targets and enforcement for pg_kafka
# Note: Some code cannot be unit tested due to pgrx/SPI constraints.
# Those files are excluded and covered by E2E tests in kafka_test/

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Project-wide coverage target
    project:
      default:
        # Target: 80% of testable code
        # Excludes SPI-dependent files (E2E tested separately)
        target: 80%
        threshold: 2%  # Allow 2% fluctuation
        if_ci_failed: error
        informational: false  # Block PRs below threshold

    # Coverage on new/modified code
    patch:
      default:
        # New code should be well-tested
        target: 90%
        threshold: 5%  # Some flexibility for generated code
        informational: false  # Block PRs below threshold

# Files excluded from coverage calculation
# These are either:
# - pgrx-generated code
# - SPI-dependent (tested via E2E suite in kafka_test/)
# - Async runtime code (E2E tested)
#
# QA-1 (AUDIT-2026-06) — coverage policy and its limitation, stated explicitly so the gate isn't a
# silent dodge:
#   * The unit patch/project gates below apply only to code that CAN run without a live PostgreSQL.
#     The files ignored here genuinely cannot (they call SPI / run inside the pgrx background worker /
#     drive the tokio listener), so unit coverage would always read 0% for them and is not meaningful.
#   * The mitigation is mandatory, not implied: every behavioural change to an ignored file MUST ship a
#     kafka_test E2E regression test that fails before / passes after (the test-per-bug rule this
#     remediation applied to e.g. BUG-3 offset reuse, BUG-4 high-watermark, BUG-5 panic→hang, BUG-7
#     timestamps, CONF-7 ListOffsets, SEC-3/4 admission/backpressure). A reviewer should reject an
#     ignored-file change that lands without one.
#   * Do NOT add a file here to route untested logic around the patch gate. The list below is for
#     genuinely SPI/async/generated code only; new entries need a one-line justification. A file
#     that mixes SPI calls with unit-testable logic goes on the `# qa1-guard:` list instead.
#   * Mechanically checked: every src/ file that calls SPI (Spi::*, BackgroundWorker::*,
#     #[pg_extern]) must be on one of the two lists (.github/scripts/check-coverage-policy.sh).
ignore:
  # pgrx generated/macro code
  - "src/bin/**"                      # pgrx embedding binary
  - "**/*_embed.rs"                   # pgrx generated files
  - "src/lib.rs"                      # _PG_init hook, #[pg_extern] SQL functions (pgrx macros, SPI)

  # SPI-dependent code (requires PostgreSQL, E2E tested)
  - "src/worker.rs"                   # Main BGWorker loop (SPI-dependent)
  - "src/kafka/storage/postgres.rs"   # PostgresStore (SPI-dependent)
  - "src/kafka/storage/postgres/roles.rs"  # Forwards every storage role to postgres.rs (SPI)
  - "src/kafka/shadow/store.rs"       # ShadowStore (SPI-dependent, wraps PostgresStore)
  - "src/kafka/auth/credentials.rs"   # DB-thread SELECT on kafka.sasl_credentials (SPI)
  - "src/kafka/auth/users.rs"         # #[pg_extern] SASL user-management functions (SPI)

  # Async runtime code (E2E tested)
  - "src/kafka/listener.rs"           # Async TCP listener (tokio runtime)

# QA-1 guard without an ignore entry. These files mix SPI calls with logic that unit tests do
# reach, so they stay in the coverage figures, but their SPI part is invisible to unit tests,
# so the spi-e2e-guard treats them like the ignored files: a change to one needs a kafka_test
# change. .github/scripts/require-e2e-for-spi.sh reads both lists (the `- "src/..."` entries
# above and the `# qa1-guard:` lines below); .github/scripts/check-coverage-policy.sh fails CI
# when a src/ file that calls SPI is on neither list, or a listed file does not exist.
# qa1-guard: "src/kafka/metrics.rs"         # write_batch: the SPI flush of the request metrics
# qa1-guard: "src/kafka/shadow/outbox.rs"   # SpiShadowDb (the rest is tested with a fake DB)
# qa1-guard: "src/kafka/shadow/primary.rs"  # is_primary(): SELECT NOT pg_is_in_recovery()

# Comment configuration for PR reviews
comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: true  # Only comment when coverage changes

# Flag configuration for test suites
flags:
  unit:
    paths:
      - src/
    carryforward: true
