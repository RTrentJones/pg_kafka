# Codecov configuration (https://docs.codecov.com/docs/codecov-yaml): the coverage gates for
# pg_kafka's unit tests. Code that needs a live PostgreSQL is excluded below and covered by the
# E2E suite in kafka_test/.

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    # Project-wide coverage target
    project:
      default:
        # Target: 80% of testable code
        # Excludes SPI-dependent files (E2E tested separately)
        target: 80%
        threshold: 2%  # Allow 2% fluctuation
        if_ci_failed: error
        informational: false  # Block PRs below threshold

    # Coverage on new/modified code
    patch:
      default:
        # New code should be well-tested
        target: 90%
        threshold: 5%  # Some flexibility for generated code
        informational: false  # Block PRs below threshold

# Files excluded from coverage: pgrx-generated code, and code that only runs against a live
# PostgreSQL (SPI, the background worker) or inside the tokio listener, for which unit coverage
# would always read 0%.
#
# QA-1 rule: every behavioural change to a file listed here (or on a `# qa1-guard:` line below)
# must ship a kafka_test/ E2E regression test that fails before and passes after; the
# spi-e2e-guard CI job (.github/scripts/require-e2e-for-spi.sh) enforces it. Do NOT add a file
# here to route untested logic around the patch gate: entries are for genuinely
# SPI/async/generated code, each with a one-line justification. A file that mixes SPI calls with
# unit-testable logic goes on the `# qa1-guard:` list instead. Every src/ file that calls SPI
# (Spi::*, BackgroundWorker::*, #[pg_extern]) must be on one of the two lists, and entries must
# be literal paths (no globs) for the guard to see them (.github/scripts/check-coverage-policy.sh).
ignore:
  # pgrx generated/macro code
  - "src/bin/**"                      # pgrx embedding binary
  - "**/*_embed.rs"                   # pgrx generated files
  - "src/lib.rs"                      # _PG_init hook, #[pg_extern] SQL functions (pgrx macros, SPI)

  # SPI-dependent code (requires PostgreSQL, E2E tested)
  - "src/worker/mod.rs"               # BGWorker entry point and main loop (SPI)
  - "src/worker/batch.rs"             # Group commit and response buffering (SPI transactions)
  - "src/worker/lifecycle.rs"         # SIGTERM, postmaster death, exits (pg_sys)
  - "src/worker/maintenance.rs"       # Periodic maintenance tasks (SPI)
  - "src/worker/network.rs"           # Network thread start and channels (tokio)
  - "src/worker/schema.rs"            # Schema wait, feature detection, role reset (SPI)
  - "src/worker/txn.rs"               # worker_transaction, schema locks, subtransactions (SPI)
  - "src/kafka/storage/postgres.rs"   # PostgresStore (SPI-dependent)
  - "src/kafka/storage/postgres/roles.rs"  # Forwards every storage role to postgres.rs (SPI)
  - "src/kafka/storage/postgres/log.rs"          # LogStore SQL: records, offset bounds, DeleteRecords (SPI)
  - "src/kafka/storage/postgres/maintenance.rs"  # Retention sweep, partition maintenance, txn timeouts (SPI)
  - "src/kafka/storage/postgres/offsets.rs"      # OffsetStore SQL: group offsets (SPI)
  - "src/kafka/storage/postgres/producers.rs"    # ProducerStore SQL: producer ids, epochs, sequences (SPI)
  - "src/kafka/storage/postgres/topics.rs"       # TopicStore SQL: catalog, admin, retention.ms (SPI)
  - "src/kafka/storage/postgres/transactions.rs" # TransactionStore SQL (SPI)
  - "src/kafka/storage/postgres/worker_role.rs"  # SET ROLE to pg_kafka.run_as_role (SPI)
  - "src/kafka/shadow/store.rs"       # ShadowStore (SPI-dependent, wraps PostgresStore)
  - "src/kafka/auth/credentials.rs"   # DB-thread SELECT on kafka.sasl_credentials (SPI)
  - "src/kafka/auth/users.rs"         # #[pg_extern] SASL user-management functions (SPI)

  # Async runtime code (E2E tested)
  - "src/kafka/listener/mod.rs"         # Listener entry, notifier task, shutdown (tokio)
  - "src/kafka/listener/accept.rs"      # Accept loop and admission (tokio)
  - "src/kafka/listener/tls.rs"         # TLS handshake, client-certificate principal (tokio)
  - "src/kafka/listener/sasl.rs"        # SASL frames and throttled credential lookups (tokio)

# QA-1 guard without an ignore entry. These files mix SPI or tokio network code with logic unit tests
# do reach, so they stay in the coverage figures, but that part is invisible to unit tests,
# so the spi-e2e-guard treats them like the ignored files: a change to one needs a kafka_test
# change. .github/scripts/require-e2e-for-spi.sh reads both lists (the `- "src/..."` entries
# above and the `# qa1-guard:` lines below); .github/scripts/check-coverage-policy.sh fails CI
# when a src/ file that calls SPI is on neither list, or a listed file does not exist.
# qa1-guard: "src/kafka/listener/connection.rs"  # Per-connection read loop and deadlines (tokio), partly unit-tested
# qa1-guard: "src/kafka/listener/writer.rs"      # Response writer (tokio), partly unit-tested
# qa1-guard: "src/kafka/listener/dispatch.rs"    # Request dispatch and long-poll spawn (tokio), partly unit-tested
# qa1-guard: "src/kafka/listener/long_poll.rs"   # Long-poll tasks (tokio), partly unit-tested
# qa1-guard: "src/kafka/listener/thread.rs"      # Network thread runtime (tokio), partly unit-tested
# qa1-guard: "src/kafka/metrics.rs"         # write_batch: the SPI flush of the request metrics
# qa1-guard: "src/kafka/shadow/outbox.rs"   # SpiShadowDb (the rest is tested with a fake DB)
# qa1-guard: "src/kafka/shadow/primary.rs"  # is_primary(): SELECT NOT pg_is_in_recovery()

# Comment configuration for PR reviews
comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: true  # Only comment when coverage changes

# Flag configuration for test suites
flags:
  unit:
    paths:
      - src/
    carryforward: true
