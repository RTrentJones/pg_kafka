[package]
name = "pg_kafka"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_kafka"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg14"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
# PostgreSQL extension framework (requires nightly Rust)
pgrx = "=0.16.1"

# Async runtime for TCP listener and connection handling
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["codec"] }
futures = "0.3.31"

# Binary protocol handling
bytes = "1.11"
kafka-protocol = "0.17"
# Record-batch decompressors, driven directly so the decoded size is charged to the
# request's decode budget as it is produced (protocol/decode_budget.rs). The same versions
# kafka-protocol uses.
flate2 = "1.1"
lz4 = "1.28"
snap = "1.1"
zstd = "0.14"

# Concurrency and synchronization
crossbeam-channel = "0.5.15"
once_cell = "1.21"
parking_lot = "0.12"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Production-grade structured logging (thread-safe, async-safe)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization and utilities
serde_json = "1.0"
uuid = { version = "1.19", features = ["v4"] }

# Partitioner support
murmur2 = "0.1"
rand = "0.8"

# Shadow mode: External Kafka producer (Phase 11)
# CRITICAL: Do NOT add "ssl-vendored" feature! Postgres links against system OpenSSL.
# Bundling a different OpenSSL version will cause symbol conflicts and crash Postgres.
# The "ssl" feature uses system OpenSSL from librdkafka-dev package.
rdkafka = { version = "0.36", features = ["cmake-build", "sasl", "ssl", "zstd"] }

# Listener security (TLS + SASL). rustls with the `ring` provider only: pure Rust
# plus ring's bundled C/asm, no system library (aws-lc-rs, the rustls default, is
# disabled so no cmake/nasm is needed and nothing links against system OpenSSL).
# ring also provides the SCRAM primitives (SHA-256/512, HMAC, PBKDF2, CSPRNG).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
pgrx-tests = "=0.16.1"
proptest = "1.5"
mockall = "0.13.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"  # "thin" provides most benefits of "fat" with smaller intermediate files
codegen-units = 1

# kafka-protocol is patched to a fork that bounds what a hostile request can make the decoders
# allocate. Upstream 0.17.0 sizes Vec::with_capacity, the RecordBatch record-count `reserve` and
# the byte/string buffers straight from wire lengths, so one crafted request can trigger a
# multi-GB allocation; an allocation failure aborts the worker process (it is not an unwinding
# panic, so parse_request's catch_unwind cannot contain it). The fork caps those capacity hints
# (honest inputs still grow the Vec) and caps decompressed record-batch size at 256 MiB for
# gzip/lz4/zstd/snappy, so a decompression bomb is rejected. It also moves to zstd 0.14, which
# clears the zstd-safe 7.x / zstd-sys 2.0 advisories. The caps are in records.rs and
# protocol/types.rs of https://github.com/RTrentJones/kafka-protocol-rs
# (branch claude/upbeat-cori-utc1j7).
#
# The rev pin keeps builds reproducible; cargo-deny (deny.toml [sources]) allows no other git
# source. If the fork ever disappears: push a clone from any ~/.cargo/git/checkouts to a new
# remote and repoint, or `cargo vendor` from an intact cache; the long-term exit is upstreaming
# the caps to tychedelia/kafka-protocol-rs.
[patch.crates-io]
kafka-protocol = { git = "https://github.com/RTrentJones/kafka-protocol-rs", rev = "642043e3a6681e51e2b6d37e5c8b69c2db633ea6" }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not fit this crate: Kafka API and type names fill the docs
# (doc_markdown), handler and store names repeat their module by design, and the
# GUC/config structs are flag bags.
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Restriction lints this codebase holds itself to.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
