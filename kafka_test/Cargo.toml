[package]
name = "kafka_test"
version = "0.1.0"
edition = "2021"
# Test harness only, no Shadow Mode code — plain MIT like the project root
# (required so `cargo deny check licenses` can evaluate this crate; DR-16).
license = "MIT"

[dependencies]
# Kafka client for E2E testing
rdkafka = { version = "0.36", features = ["cmake-build", "zstd"] }

# Async utilities for parallel execution
futures = "0.3"

# Async runtime
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
    "io-util",
] }

# For protocol encoding/decoding
bytes = "1"
kafka-protocol = "0.17"
crc32c = "0.6"

# Database client for verification
tokio-postgres = "0.7.15"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Unique test identifiers
uuid = { version = "1", features = ["v4"] }

# Serialization for JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Timing utilities
chrono = { version = "0.4", features = ["serde"] }

# Same kafka-protocol fork as the root crate (see ../Cargo.toml): the fork also moves zstd to 0.14,
# which clears the zstd-safe 7.x / zstd-sys 2.0 advisories that crates.io kafka-protocol 0.17
# (zstd ^0.13) cannot. Keep this rev in lockstep with the root [patch.crates-io].
[patch.crates-io]
kafka-protocol = { git = "https://github.com/RTrentJones/kafka-protocol-rs", rev = "642043e3a6681e51e2b6d37e5c8b69c2db633ea6" }
